<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magracia | Product</title><link rel="stylesheet" href="styles.css?v=6"></head>
<body>
<header><h1>MAGRACIA<small>CHOSEN, NOT CHASED</small></h1><nav><a href="/">HOME</a><a href="/#collection">SHOP</a><a href="mailto:support@magracia.com">CONTACT</a></nav></header>
<main><div id="product" class="product"><p>Loading…</p></div><div class="wrap"><section id="related"></section></div></main>
<footer><p>© 2026 MAGRACIA · <a href="https://www.etsy.com/shop/MagraciaOfficial">Buy Now On ETSY</a></p></footer>
<script>
const handle=new URLSearchParams(location.search).get('handle');
fetch('products.json?v=6').then(r=>r.json()).then(products=>{
  const p=products.find(x=>x.handle===handle);
  if(!p){document.getElementById('product').innerHTML='<p>Sorry, that piece could not be found. <a href="/">Back to the collection</a></p>';return}
  document.title='Magracia | '+p.title;
  let colour=p.colours[0], size=p.sizes[0];
  function stockFor(c,s){const v=(p.variants||[]).find(v=>v.colour===c&&v.size===s); if(!v) return null; return v.stock}
  function br(s){return (s||'').replace(/\n/g,'<br>')}
  function stockText(){const s=stockFor(colour,size); if(s===null||s===undefined) return 'In stock'; return s>0?('In stock · '+s+' available'):'Out of stock'}
  function render(){
    document.getElementById('product').innerHTML=
    '<div class="gallery"><img class="main" id="mainImg" src="'+(p.images[0]||'')+'" alt="'+p.title.replace(/"/g,'')+'"><div class="thumbs">'+(p.images||[]).map((im,i)=>'<img src="'+im+'" class="'+(i===0?'active':'')+'" onclick="document.getElementById(\'mainImg\').src=this.src;document.querySelectorAll(\'.thumbs img\').forEach(x=>x.classList.remove(\'active\'));this.classList.add(\'active\')">').join('')+'</div></div>'+
    '<div><p class="stock" id="stockLine">● '+stockText()+'</p><h1 class="ptitle">'+p.title+'</h1><p>'+(p.description||'')+'</p>'+
    (p.styling&&p.styling.length?'<h3>Styling</h3><ul>'+p.styling.map(s=>'<li>'+s+'</li>').join('')+'</ul>':'')+
    '<div class="picker"><strong>Colour:</strong> '+p.colours.map(c=>'<button class="'+(c===colour?'sel':'')+'" onclick="setColour(\''+c.replace(/'/g,'')+'\')">'+c+'</button>').join('')+'</div>'+
    '<div class="picker"><strong>Size:</strong> '+p.sizes.map(s=>'<button class="'+(s===size?'sel':'')+'" onclick="setSize(\''+s+'\')">'+s+'</button>').join('')+'</div>'+
    '<div class="badges"><div class="badge">♡<br>Made with care</div><div class="badge">◈<br>Great value</div></div>'+
    '<details open><summary>Custom Sizing</summary><p>'+(p.custom_sizing||'')+'</p></details>'+
    '<details><summary>Details</summary><p>'+(p.details||'')+'</p></details>'+
    '<details><summary>Shipping &amp; Returns</summary><p>'+(p.shipping_returns||'')+'</p></details>'+
    '<p><a class="btn buy" href="'+p.etsy_url+'">BUY NOW ON ETSY</a></p><p><a href="/#collection">← Back to the collection</a></p></div>';
  }
  window.setColour=c=>{colour=c;render()}; window.setSize=s=>{size=s;render()};
  render();
  const rel=products.filter(x=>x.collection===p.collection&&x.handle!==p.handle).slice(0,4);
  document.getElementById('related').innerHTML='<h2 class="sec">More in '+p.collection+'</h2><div class="grid">'+rel.map(x=>'<article class="card"><a href="product.html?handle='+encodeURIComponent(x.handle)+'"><img src="'+(x.images[0]||'')+'" alt="'+x.title.replace(/"/g,'')+'"></a><div class="card-body"><h3>'+x.title+'</h3><a class="btn" href="product.html?handle='+encodeURIComponent(x.handle)+'">View Piece</a></div></article>').join('')+'</div>';
});
</script></body></html>
